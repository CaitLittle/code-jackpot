<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Code Jackpot – Electrical Exam Study Game</title>
<meta name="description" content="Washington electrical exam study game: NEC, theory, load calcs and Washington law. English and Spanish.">
<meta name="theme-color" content="#0d1326">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Code Jackpot">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0d1326; --panel:#18213f; --panel2:#212c52; --line:#2f3c6b;
  --gold:#ffc83d; --gold2:#ff9f1c; --volt:#3ee6ff; --good:#3ddc84; --bad:#ff5a6e;
  --text:#eef2ff; --muted:#9aa6cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#24306a 0%,var(--bg) 55%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
h1{font-family:Bungee,Inter,sans-serif;font-weight:400;font-size:26px;margin:4px 0 2px;text-align:center;letter-spacing:1px;
  background:linear-gradient(180deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
.chip b{display:block;font-size:17px}
.chip span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.lvl{height:8px;background:var(--panel);border-radius:6px;overflow:hidden;margin:0 0 4px;border:1px solid var(--line)}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--volt),#8a7dff);width:0;transition:width .5s}
.lvltxt{font-size:11px;color:var(--muted);text-align:right;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 0;border-radius:12px;background:var(--panel);color:var(--muted);font-weight:800;font-size:14px;border:1px solid var(--line)}
.tabs button.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;border-color:transparent}
section{display:none}
section.on{display:block}

/* Slots */
.machine{background:linear-gradient(180deg,#3a1d6e,#22124a);border-radius:22px;padding:16px 14px 18px;border:3px solid var(--gold);box-shadow:0 0 0 4px #5a2fa0,0 10px 30px #0008}
.marquee{text-align:center;font-family:Bungee,sans-serif;color:var(--gold);font-size:15px;margin-bottom:10px;letter-spacing:2px}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0a0f20;padding:10px;border-radius:14px;border:2px solid #000}
.reel{position:relative;background:linear-gradient(180deg,#d9dff5,#fff 45%,#fff 55%,#c9d0ea);border-radius:10px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.reel .sym{font-size:44px;line-height:1}
.reel .lab{font-size:10px;color:#333a5c;font-weight:800;margin-top:4px;text-align:center;padding:0 2px}
.reel.spin>.sym,.reel.spin>.lab{visibility:hidden}
.reel .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel .cellr{height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reel.thunk{animation:thunk .22s ease-out}
@keyframes thunk{0%{transform:translateY(3px)}100%{transform:none}}
.reel.win{box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold)}
.bigbtn{display:block;width:100%;margin-top:14px;padding:16px;border-radius:16px;font-family:Bungee,sans-serif;font-size:22px;color:#2a1a00;
  background:linear-gradient(180deg,#ffe07a,var(--gold2));box-shadow:0 6px 0 #b86a00;letter-spacing:2px}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b86a00}
.bigbtn:disabled{filter:grayscale(.8);opacity:.6}
.msg{min-height:22px;text-align:center;margin-top:10px;font-weight:800;color:var(--gold)}
.ghost{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;background:var(--panel2);color:var(--text);font-weight:600;border:1px solid var(--line)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:14px;font-size:12px;color:var(--muted)}

/* Board */
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;aspect-ratio:1;background:#0a0f20;padding:6px;border-radius:16px;border:2px solid var(--line)}
.cell{border-radius:8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;text-align:center;position:relative;padding:2px;line-height:1.1}
.cell .e{font-size:20px}
.cell.own{border-color:var(--gold);background:linear-gradient(180deg,#3b3216,var(--panel))}
.cell.own::after{content:"🏠";position:absolute;top:1px;right:2px;font-size:10px}
.cell.special{background:linear-gradient(180deg,#2c1f5c,var(--panel))}
.cell .tok{position:absolute;bottom:-4px;font-size:20px;filter:drop-shadow(0 2px 2px #000);animation:hop .4s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-16px) scale(1.15)}100%{transform:none}}
.center{grid-column:2/6;grid-row:2/6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle,#24306a,#111833);border-radius:12px}
.dice{display:flex;gap:10px}
.die{width:52px;height:52px;background:#fff;color:#111;border-radius:12px;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #9aa}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
.center .bigbtn{width:80%;margin-top:4px;font-size:18px;padding:12px}
.center .msg{margin-top:0;font-size:13px;padding:0 8px}
.owned{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}

/* Stats */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.bar .n{width:120px;flex-shrink:0}
.bar .t{flex:1;height:10px;background:#0a0f20;border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .p{width:62px;text-align:right;color:var(--muted)}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:8px 12px;border-radius:10px;font-size:12px;margin-top:6px}

/* Modal */
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px 26px;border-top:3px solid var(--gold);max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.qcat{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--panel2);color:var(--volt);margin-bottom:8px}
.qmult{float:right;font-family:Bungee,sans-serif;color:var(--gold);font-size:14px}
.qtext{font-size:17px;font-weight:600;line-height:1.4;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:7px 0;border-radius:12px;background:var(--panel2);color:var(--text);font-size:15px;border:2px solid var(--line)}
.opt.right{border-color:var(--good);background:#173d2c}
.opt.wrong{border-color:var(--bad);background:#43192a}
.opt:disabled{cursor:default}
.explain{display:none;margin-top:10px;padding:12px;border-radius:12px;background:#0f1630;font-size:14px;line-height:1.5}
.explain .ref{display:block;margin-top:6px;color:var(--volt);font-size:12px;font-weight:600}
.result{font-family:Bungee,sans-serif;font-size:20px;text-align:center;margin:10px 0 2px}
.result.g{color:var(--good)}.result.b{color:var(--bad)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1a00;font-weight:800;padding:10px 16px;border-radius:30px;z-index:20;display:none;box-shadow:0 6px 20px #0008;text-align:center;max-width:90%}
.burst{position:fixed;pointer-events:none;font-size:26px;z-index:30;animation:fly 1s forwards}
@keyframes fly{to{transform:translateY(-160px) scale(1.4);opacity:0}}
.langbar{display:flex;justify-content:flex-end;gap:4px;margin-bottom:2px}
.langbar button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700}
.langbar button.on{background:var(--volt);color:#04202a;border-color:transparent}
.calcbtn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:14px;font-weight:800;font-size:15px;color:#04202a;background:linear-gradient(180deg,#7ff0ff,var(--volt));box-shadow:0 5px 0 #1a8ea0}
.calcbtn:disabled{filter:grayscale(.8);opacity:.6}
.tabs button{font-size:13px}
.lbsort{display:flex;gap:6px;margin:4px 0 10px}
.lbsort button{flex:1;padding:8px 0;border-radius:10px;background:var(--panel2);color:var(--muted);font-weight:700;font-size:12px;border:1px solid var(--line)}
.lbsort button.on{background:var(--volt);color:#04202a;border-color:transparent}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin:4px 0;background:var(--panel2)}
.lbrow.me{border:2px solid var(--gold);background:#2e2a14}
.lbrow .rk{width:30px;text-align:center;font-family:Bungee,sans-serif;color:var(--gold);font-size:15px}
.lbrow .nm{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .vl{font-weight:800;font-size:14px}
.nickrow{display:flex;gap:6px}
.nickrow input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0f1630;color:var(--text);font-size:15px;font-family:inherit}
.nickrow button{padding:0 14px;border-radius:10px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1a00;font-weight:800}
.steps{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.55}
.steps li{margin-bottom:4px}

.pieces .avbtn{font-size:26px;padding:8px 0}
.startbtn{font-size:26px;padding:20px;margin-top:16px}
.tutm{align-items:center;z-index:25}
.tutsheet{border-radius:22px;border:3px solid var(--gold);margin:0 14px;text-align:center;padding:22px 18px 18px}
.tutsheet .tstep{font-size:12px;font-weight:800;color:var(--volt);letter-spacing:.08em}
.tutsheet .ticon{font-size:64px;line-height:1;margin:10px 0 6px;animation:tpop .35s ease-out}
@keyframes tpop{from{transform:scale(.5);opacity:0}}
.tutsheet .ttitle{font-family:Bungee,sans-serif;font-size:22px;color:var(--gold);margin:4px 0 8px}
.tutsheet .ttext{font-size:16px;line-height:1.45;margin:0 0 10px}
.tutsheet .tdots{display:flex;gap:6px;justify-content:center;margin:8px 0 4px}
.tutsheet .tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tutsheet .tdots i.on{background:var(--gold)}
.tutsheet .trow{display:flex;gap:8px;align-items:center}
.tutsheet .trow .bigbtn{flex:1;margin-top:8px;font-size:18px;padding:12px}
.tutsheet .tskip{background:none;border:0;color:var(--muted,#9aa4c8);font-size:14px;padding:10px;margin-top:8px}

body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px}
.exambtn{background:var(--panel);color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800}
.langbar{margin:0}
.examcard{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:14px;background:var(--panel2);color:var(--text);border:2px solid var(--line)}
.examcard.on{border-color:var(--gold)}
.examcard b{display:block;font-size:16px;margin-bottom:3px}
.examcard span{font-size:12px;color:var(--muted)}
.enbtn{background:transparent;border:1px solid var(--volt);color:var(--volt);border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
.entext{display:none;color:var(--muted);font-size:13px;font-style:italic;margin-top:4px}
.showen .entext{display:block}
.opt .entext{font-size:12px}
.lbtoggle{display:flex;gap:6px;margin:0 0 8px}
.lbtoggle button{flex:1;padding:8px 0;border-radius:10px;background:var(--panel2);color:var(--muted);font-weight:700;font-size:12px;border:1px solid var(--line)}
.lbtoggle button.on{background:var(--gold);color:#2a1a00;border-color:transparent}
.lbsort button.on{background:var(--volt);color:#04202a;border-color:transparent}
.sheetrow{margin-top:10px}
.tabs{gap:4px}.tabs button{font-size:11px;padding:9px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
body:not([data-theme="classic"]) .calcbtn{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0)),var(--volt);box-shadow:0 5px 0 rgba(0,0,0,.35);color:#1d1424}
.rdy{display:flex;align-items:baseline;gap:10px}.rdyn{font-family:Bungee,sans-serif;font-size:34px}.rdyl{font-weight:800}
.gauge{position:relative;height:14px;background:#0a0f20;border-radius:8px;overflow:hidden;margin:6px 0 2px}.gauge i{display:block;height:100%;width:0;transition:width .5s}.gauge b{position:absolute;left:70%;top:0;bottom:0;width:2px;background:#fff}
.weakrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:5px 0}
.mini{background:var(--panel2);color:var(--volt);border:1px solid var(--volt);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.modebtn{background:linear-gradient(180deg,#2c1f5c,var(--panel));border:1px solid var(--gold);border-radius:14px;padding:12px 8px;color:var(--text);text-align:center}
.modebtn b{display:block;font-size:14px;color:var(--gold)}.modebtn span{font-size:11px;color:var(--muted)}
.unit{background:var(--panel2);border-radius:12px;margin-top:10px;padding:8px}
.uhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:4px}.uhead .ut{flex:1}.uhead .uc{color:var(--muted);font-size:12px}
.lrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0;font-size:14px}
.lrow .lt{flex:1}.lrow .ls{font-size:11px;color:var(--muted)}.lrow.open{border-color:var(--gold)}.lrow.done .ls{color:var(--good)}.lrow.locked{opacity:.5}.lrow.safety .lt{color:#ffd27a}
.lbody{font-size:15px;line-height:1.55}.lpar{margin:10px 0}.lbul{margin:4px 0 4px 14px;position:relative}.lbul:before{content:"•";position:absolute;left:-12px;color:var(--gold)}
.exhead{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:13px}#exClock,#lkClock{font-family:Bungee,sans-serif;color:var(--gold)}
.exnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt.sel{border-color:var(--volt);background:#123a4a}
.jobt{font-weight:800;margin:10px 0 4px}
.pieces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.piece{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;opacity:.45;filter:grayscale(1)}
.piece.got{opacity:1;filter:none;border-color:var(--gold);background:linear-gradient(180deg,#3b3216,var(--panel2))}
.piece.next{opacity:.9;filter:none;border-style:dashed;border-color:var(--gold)}
.piece .pe{font-size:24px}.piece .pn{font-size:9px;line-height:1.15;margin-top:3px}
.shoprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.pubar{display:flex;gap:6px;margin:0 0 4px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;opacity:.35;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;border-color:var(--gold)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.themebtn{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 4px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700}
.themebtn.on{border-color:var(--gold)}.themebtn .sw{width:100%;height:26px;border-radius:8px;display:block}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.avbtn{background:var(--panel2);border:2px solid var(--line);border-radius:12px;font-size:24px;padding:6px 0}.avbtn.on{border-color:var(--gold);background:var(--panel)}
body[data-theme="rose"]{--bg:#1c0d16;--panel:#331a28;--panel2:#42223a;--line:#6a3a58;--gold:#f4b6c2;--gold2:#e8a87c;--volt:#ffd6e0;--text:#fff1f5;--muted:#d9a9bb}
body[data-theme="rose"]{background:radial-gradient(circle at 50% -10%,#5a2a44 0%,#1c0d16 55%)}
body[data-theme="lavender"]{--bg:#14102a;--panel:#241c44;--panel2:#2f2556;--line:#4b3f80;--gold:#c9b6ff;--gold2:#a48bff;--volt:#7ee8c8;--text:#f3efff;--muted:#b2a6d9}
body[data-theme="lavender"]{background:radial-gradient(circle at 50% -10%,#3e2f78 0%,#14102a 55%)}
body[data-theme="mint"]{--bg:#0b1f1f;--panel:#133232;--panel2:#1a4040;--line:#2c5f5f;--gold:#ff8a7a;--gold2:#ff6b5e;--volt:#7ee8d0;--text:#effffb;--muted:#9fcfc6}
body[data-theme="mint"]{background:radial-gradient(circle at 50% -10%,#1f5a55 0%,#0b1f1f 55%)}
body[data-theme="sunset"]{--bg:#1f0f1a;--panel:#35192b;--panel2:#452238;--line:#6e3654;--gold:#ffb347;--gold2:#ff7e5f;--volt:#ff8fb1;--text:#fff4ec;--muted:#e0b0b8}
body[data-theme="sunset"]{background:radial-gradient(circle at 50% -10%,#6a2a46 0%,#1f0f1a 55%)}
body[data-theme="midnight"]{--bg:#0c0a1c;--panel:#1b1734;--panel2:#252046;--line:#3e3670;--gold:#ff7eb6;--gold2:#ff5fa2;--volt:#9ad0ff;--text:#f6f2ff;--muted:#aaa3d6}
body[data-theme="midnight"]{background:radial-gradient(circle at 50% -10%,#3a2a6a 0%,#0c0a1c 55%)}
body:not([data-theme="classic"]) .machine{border-color:var(--gold);box-shadow:0 0 0 4px var(--panel2),0 10px 30px #0008;background:linear-gradient(180deg,var(--panel2),var(--panel))}
body:not([data-theme="classic"]) .bigbtn{background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 6px 0 rgba(0,0,0,.4)}
.scene{position:relative;border-radius:12px;overflow:hidden;margin:10px 0;border:1px solid var(--line)}
.scene-svg{display:block;width:100%;height:auto}
.scene g.pt{transition:opacity .4s}.scene g.pt.off{opacity:.13;filter:grayscale(1)}
.scene g.pt.nextpt{animation:ghostpulse 1.4s ease-in-out infinite;filter:grayscale(.6)}
@keyframes ghostpulse{0%,100%{opacity:.2}50%{opacity:.55}}
.scene g.pt.popin{transform-box:fill-box;transform-origin:center;animation:popin .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.scene .confetti{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{top:110%;transform:rotate(540deg)}}
.scene .banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);background:var(--gold);color:#2a1a00;font-weight:900;padding:10px 18px;border-radius:30px;box-shadow:0 6px 20px #0008;animation:bannerin .5s .2s forwards;opacity:0;white-space:nowrap}
@keyframes bannerin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.scene.party{animation:shake .5s 2}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
.badge .be{font-size:24px}.badge .bn{font-size:10px;line-height:1.2;margin-top:3px}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:8px}
.mission b{color:var(--gold)}
.mission .mt{flex:1}
.mission .mp{height:6px;background:#0a0f20;border-radius:4px;overflow:hidden;margin-top:4px}
.mission .mp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--good));width:0;transition:width .4s}
.tabs button.next{position:relative}
.tabs button.next::after{content:"";position:absolute;top:5px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:ping 1.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #ff5a6eaa}100%{box-shadow:0 0 0 8px #ff5a6e00}}
.boost{display:none;text-align:center;font-weight:800;color:var(--good);margin-top:8px;font-size:13px}
.boost.on{display:block}
.nudge{text-align:center}
.nudge .big{font-size:54px;line-height:1;margin:4px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="exambtn" id="examBtn"></button>
    <div class="langbar"><button data-lang="en">English</button><button data-lang="es">Español</button></div>
  </div>
  <h1>⚡ CODE JACKPOT ⚡</h1>
  <div class="sub" id="subTxt"></div>

  <div class="hud">
    <div class="chip"><b id="coins">0</b><span data-t="wallet"></span></div>
    <div class="chip"><b id="spins">0</b><span data-t="spins"></span></div>
    <div class="chip"><b id="streak">0</b><span data-t="streak"></span></div>
    <div class="chip"><b id="acc">–</b><span data-t="acc"></span></div>
  </div>
  <div class="lvl"><i id="lvlbar"></i></div>
  <div class="lvltxt" id="lvltxt"></div>

  <div class="tabs">
    <button data-tab="leaders" class="on" data-t="tabLeaders"></button>
    <button data-tab="learn" data-t="tabLearn"></button>
    <button data-tab="slots" data-t="tabSlots"></button>
    <button data-tab="board" data-t="tabBoard"></button>
    <button data-tab="stats" data-t="tabStats"></button>
  </div>

  <section id="slots">
    <div class="mission" id="missionS"></div>
    <div class="machine">
      <div class="marquee" data-t="marquee"></div>
      <div class="reels">
        <div class="reel" id="r0"><div class="sym"></div><div class="lab"></div></div>
        <div class="reel" id="r1"><div class="sym"></div><div class="lab"></div></div>
        <div class="reel" id="r2"><div class="sym"></div><div class="lab"></div></div>
      </div>
      <button class="bigbtn" id="spinBtn" data-t="spin"></button>
      <div class="msg" id="slotMsg"></div>
      <div class="boost" id="slotBoost"></div>
    </div>
    <button class="calcbtn" id="focusBtn"></button>
    <button class="ghost" id="practiceBtn" data-t="practice"></button>
    <div class="legend">
      <div data-t="leg1"></div><div data-t="leg2"></div>
      <div data-t="leg3"></div><div data-t="leg4"></div>
    </div>
  </section>

  <section id="board">
    <div class="mission" id="missionB"></div>
    <div class="board" id="boardGrid"></div>
    <div class="boost" id="boardBoost"></div>
    <div class="owned" id="ownedTxt"></div>
    <div class="card" id="buildCard" style="margin-top:12px"></div>
    <div class="card" id="shopCard"></div>
  </section>

  <section id="leaders" class="on">
    <div class="card"><h3 id="lbTitle"></h3>
      <div class="lbtoggle"><button data-period="week" class="on" data-t="week"></button><button data-period="all" data-t="allTime"></button></div>
      <div class="lbsort"><button data-sort="coins" class="on" data-t="sortCoins"></button><button data-sort="focus" id="sortFocus"></button><button data-sort="acc" data-t="sortAcc"></button></div>
      <div id="lbList"></div>
      <div class="note" id="lbStatus" style="margin-top:8px"></div>
    </div>
    <div class="card" id="playerCard"><h3 data-t="lbNick"></h3>
      <div class="nickrow"><input id="nickIn" maxlength="20" autocomplete="off"><button id="nickBtn" data-t="lbSave"></button></div>
      <div class="note" style="margin-top:8px" data-t="lbNote"></div>
      <h3 style="margin-top:14px" id="pieceTitle"></h3>
      <div class="avatars pieces" id="pieceRow"></div>
      <button class="bigbtn startbtn" id="startBtn" ></button>
    </div>
  </section>

  <section id="learn">
    <div class="card" id="readyCard"></div>
    <div class="modes"><button class="modebtn" id="examModeBtn"><b data-t="examBtn"></b><span data-t="examBtnSub"></span></button><button class="modebtn" id="lookupModeBtn"><b data-t="lookupBtn"></b><span data-t="lookupBtnSub"></span></button></div>
    <div class="card"><h3 data-t="pathTitle"></h3><div class="note" data-t="pathNote"></div><div class="note" id="pathCount" style="margin-top:6px;color:var(--gold)"></div><div id="pathList"></div></div>
    <div class="card" id="remCard"></div>
  </section>

  <section id="stats">
    <div class="card" id="lookCard"></div>
    <div class="card" id="badgeCard"></div>
    <div class="card"><h3 data-t="accTopic"></h3><div id="catBars"></div>
      <div class="note" style="margin-top:8px" data-t="statsNote"></div></div>
    <div class="card" id="sheetCalc"><h3 data-t="sheetTitle"></h3><div class="note" data-t="sheetIntro"></div><ol class="steps" data-t="sheetSteps"></ol></div>
    <div class="card" id="sheetHvac"><h3 data-t="hvacTitle"></h3><ol class="steps" data-t="hvacSteps"></ol></div>
    <div class="card"><h3 data-t="review"></h3><div id="missList" class="note"></div></div>
    <div class="card note">
      <span data-t="disclaimer"></span>
      <br><button class="danger" id="resetBtn" data-t="reset"></button>
    </div>
  </section>
</div>

<div class="modal tutm" id="tutModal"><div class="sheet tutsheet" id="tutSheet"></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="questions.js"></script>
<script src="lessons.js"></script>
<script src="extras.js"></script>
<script src="app.js"></script>
</body>
</html>
